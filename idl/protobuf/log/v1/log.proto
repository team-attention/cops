syntax = "proto3";

package log.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/team-attention/cops/shared/gen/grpcstub/log/v1;logv1";

// SessionType represents the type of session message.
enum SessionType {
  SESSION_TYPE_UNSPECIFIED = 0;
  SESSION_TYPE_USER = 1;
  SESSION_TYPE_ASSISTANT = 2;
  SESSION_TYPE_SYSTEM = 3;
  SESSION_TYPE_SUMMARY = 4;
  SESSION_TYPE_FILE_HISTORY_SNAPSHOT = 5;
  SESSION_TYPE_QUEUE_OPERATION = 6;
}

// Usage contains token usage information.
message Usage {
  int32 input_tokens = 1;
  int32 output_tokens = 2;
  int32 cache_creation_input_tokens = 3;
  int32 cache_read_input_tokens = 4;
  string service_tier = 5;
}

// Message contains the role and content of a session message.
message Message {
  string id = 1;
  string type = 2;
  string role = 3;
  string model = 4;
  string content = 5;
  string stop_reason = 6;
  string stop_sequence = 7;
  Usage usage = 8;
}

// SessionRecord represents a single Claude Code JSONL entry.
message SessionRecord {
  string uuid = 1;
  string parent_uuid = 2;
  string session_id = 3;
  SessionType type = 4;
  google.protobuf.Timestamp timestamp = 5;
  string cwd = 6;
  string git_branch = 7;
  string version = 8;
  string user_type = 9;
  bool is_sidechain = 10;
  bool is_meta = 11;
  string slug = 12;
  string request_id = 13;
  Message message = 14;
}

// LogBatch contains multiple session records for batch sending.
message LogBatch {
  repeated SessionRecord records = 1;
  string daemon_id = 2;
  google.protobuf.Timestamp created_at = 3;
}

// SendLogsReq is the request for sending logs.
message SendLogsReq {
  LogBatch batch = 1;
}

// SendLogsRes is the response for sending logs.
message SendLogsRes {
  bool success = 1;
  string error_message = 2;
  int32 processed_count = 3;
}

// LogService handles log collection from daemons.
service LogService {
  // SendLogs sends a batch of session records to the API server.
  rpc SendLogs(SendLogsReq) returns (SendLogsRes);
}
