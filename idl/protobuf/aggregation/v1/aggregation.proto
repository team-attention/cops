syntax = "proto3";

package aggregation.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/team-attention/cops/shared/gen/grpcstub/aggregation/v1;aggregationv1";

// SessionType represents the type of session message.
enum SessionType {
  SESSION_TYPE_UNSPECIFIED = 0;
  SESSION_TYPE_USER = 1;
  SESSION_TYPE_ASSISTANT = 2;
  SESSION_TYPE_SYSTEM = 3;
  SESSION_TYPE_SUMMARY = 4;
  SESSION_TYPE_FILE_HISTORY_SNAPSHOT = 5;
  SESSION_TYPE_QUEUE_OPERATION = 6;
}

// Usage contains token usage information.
message Usage {
  int32 input_tokens = 1;
  int32 output_tokens = 2;
  int32 cache_creation_input_tokens = 3;
  int32 cache_read_input_tokens = 4;
  string service_tier = 5;
}

// ContentBlockType represents the type of content block.
enum ContentBlockType {
  CONTENT_BLOCK_TYPE_UNSPECIFIED = 0;
  CONTENT_BLOCK_TYPE_TEXT = 1;
  CONTENT_BLOCK_TYPE_TOOL_USE = 2;
  CONTENT_BLOCK_TYPE_TOOL_RESULT = 3;
  CONTENT_BLOCK_TYPE_THINKING = 4;
}

// TextContentBlock represents a text content block.
message TextContentBlock {
  string text = 1;
}

// ToolUseContentBlock represents a tool use content block.
message ToolUseContentBlock {
  string id = 1;
  string name = 2;
  string input_json = 3;  // JSON string for flexible input structure
}

// ToolResultContentBlock represents a tool result content block.
message ToolResultContentBlock {
  string tool_use_id = 1;
  string content = 2;
  bool is_error = 3;
}

// ThinkingContentBlock represents a thinking content block.
message ThinkingContentBlock {
  string thinking = 1;
  string signature = 2;
}

// ContentBlock represents a polymorphic content block using oneof.
message ContentBlock {
  ContentBlockType type = 1;
  oneof block {
    TextContentBlock text = 2;
    ToolUseContentBlock tool_use = 3;
    ToolResultContentBlock tool_result = 4;
    ThinkingContentBlock thinking = 5;
  }
}

// Message contains the role and content of a session message.
message Message {
  string id = 1;
  string type = 2;
  string role = 3;
  string model = 4;
  string text = 5;
  string stop_reason = 6;
  string stop_sequence = 7;
  Usage usage = 8;
  repeated ContentBlock content_blocks = 9;
}

// SessionRecord represents a single Claude Code JSONL entry.
message SessionRecord {
  string uuid = 1;
  string parent_uuid = 2;
  string session_id = 3;
  SessionType type = 4;
  google.protobuf.Timestamp timestamp = 5;
  string cwd = 6;
  string git_branch = 7;
  string version = 8;
  string user_type = 9;
  bool is_sidechain = 10;
  bool is_meta = 11;
  string slug = 12;
  string request_id = 13;
  Message message = 14;
}

// LogBatch contains raw JSONL lines for batch sending.
message LogBatch {
  repeated string jsonl = 1;
  string project_id = 2;
}

// SendLogsReq is the request for sending logs.
message SendLogsReq {
  LogBatch batch = 1;
}

// SendLogsRes is the response for sending logs.
message SendLogsRes {
  bool success = 1;
  string error_message = 2;
  int32 processed_count = 3;
}

// AggregationService handles log aggregation from daemons.
service AggregationService {
  // SendLogs sends a batch of raw JSONL lines to the API server.
  rpc SendLogs(SendLogsReq) returns (SendLogsRes);
}
