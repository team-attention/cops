syntax = "proto3";

package transcript.v1;

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/team-attention/cops/shared/gen/grpcstub/transcript/v1;transcriptv1";

// TranscriptType represents the type discriminator for transcript entries.
enum TranscriptType {
  TRANSCRIPT_TYPE_UNSPECIFIED = 0;
  TRANSCRIPT_TYPE_USER = 1;
  TRANSCRIPT_TYPE_ASSISTANT = 2;
  TRANSCRIPT_TYPE_SYSTEM = 3;
  TRANSCRIPT_TYPE_SUMMARY = 4;
  TRANSCRIPT_TYPE_FILE_HISTORY_SNAPSHOT = 5;
  TRANSCRIPT_TYPE_PROGRESS = 6;
}

// SystemTranscriptSubtype represents the subtype of system transcript.
enum SystemTranscriptSubtype {
  SYSTEM_TRANSCRIPT_SUBTYPE_UNSPECIFIED = 0;
  SYSTEM_TRANSCRIPT_SUBTYPE_TURN_DURATION = 1;
}

// ProgressDataType represents the subtype of progress entry.
enum ProgressDataType {
  PROGRESS_DATA_TYPE_UNSPECIFIED = 0;
  PROGRESS_DATA_TYPE_AGENT = 1;
  PROGRESS_DATA_TYPE_SKILL = 2;
}

// TreeNodeMeta contains common metadata for conversation tree nodes.
message TreeNodeMeta {
  // Parent node UUID (null for root nodes)
  string parent_uuid = 1;
  // Node UUID
  string uuid = 2;
  // Session identifier
  string session_id = 3;
  // Entry timestamp
  google.protobuf.Timestamp timestamp = 4;
  // Claude Code version
  string version = 5;
  // Current working directory
  string cwd = 6;
  // Git branch name
  string git_branch = 7;
  // Project slug
  string slug = 8;
  // User type (e.g., "external")
  string user_type = 9;
  // Whether this is a sidechain message
  bool is_sidechain = 10;
}

// ImageSource represents base64 image data.
message ImageSource {
  // Source type (e.g., "base64")
  string type = 1;
  // Media type (e.g., "image/png")
  string media_type = 2;
  // Base64-encoded data
  string data = 3;
}

// ToolResultContent represents tool execution result.
message ToolResultContent {
  // Tool use ID reference
  string tool_use_id = 1;
  // Result content (JSON string for complex types)
  string content = 2;
}

// UserMessageBlock represents a block in user message content.
message UserMessageBlock {
  // Block type: "text", "tool_result", "image"
  string type = 1;
  // Text content (for type="text")
  string text = 2;
  // Image source (for type="image")
  ImageSource source = 3;
  // Tool result (for type="tool_result")
  ToolResultContent tool_result = 4;
}

// UserMessageBlockList wraps repeated blocks for oneof usage.
message UserMessageBlockList {
  repeated UserMessageBlock blocks = 1;
}

// UserMessage represents user message content.
message UserMessage {
  // Role (always "user")
  string role = 1;
  // Content can be text or blocks
  oneof content {
    string text = 2;
    UserMessageBlockList blocks = 3;
  }
}

// ThinkingTrigger represents a trigger keyword for extended thinking.
message ThinkingTrigger {
  int32 start = 1;
  int32 end = 2;
  string text = 3;
}

// ThinkingMetadata contains extended thinking configuration.
message ThinkingMetadata {
  // Thinking level: "high", "medium", "low"
  string level = 1;
  // Whether thinking is disabled
  bool disabled = 2;
  // Trigger keywords
  repeated ThinkingTrigger triggers = 3;
}

// Todo represents a task item.
message Todo {
  string content = 1;
  // Status: "pending", "in_progress", "completed"
  string status = 2;
  string active_form = 3;
}

// UserTranscriptData contains user-specific transcript data.
message UserTranscriptData {
  TreeNodeMeta metadata = 1;
  UserMessage message = 2;
  bool is_meta = 3;
  ThinkingMetadata thinking_metadata = 4;
  repeated Todo todos = 5;
  google.protobuf.Value tool_use_result = 6;
  string source_tool_assistant_uuid = 7;
}

// AssistantContentBlock represents a content block in assistant response.
message AssistantContentBlock {
  // Block type: "thinking", "text", "tool_use"
  string type = 1;
  // For type="thinking"
  string thinking = 2;
  string signature = 3;
  // For type="text"
  string text = 4;
  // For type="tool_use"
  string id = 5;
  string name = 6;
  string input_json = 7;
}

// CacheCreation represents ephemeral cache token counts.
message CacheCreation {
  int32 ephemeral_5m_input_tokens = 1;
  int32 ephemeral_1h_input_tokens = 2;
}

// AssistantUsage represents token usage statistics.
message AssistantUsage {
  int32 input_tokens = 1;
  int32 output_tokens = 2;
  int32 cache_creation_input_tokens = 3;
  int32 cache_read_input_tokens = 4;
  CacheCreation cache_creation = 5;
  string service_tier = 6;
}

// AssistantMessage represents the API response message.
message AssistantMessage {
  string model = 1;
  string id = 2;
  // Type (e.g., "message")
  string type = 3;
  // Role (always "assistant")
  string role = 4;
  repeated AssistantContentBlock content = 5;
  string stop_reason = 6;
  string stop_sequence = 7;
  AssistantUsage usage = 8;
}

// AssistantTranscriptData contains assistant-specific transcript data.
message AssistantTranscriptData {
  TreeNodeMeta metadata = 1;
  string request_id = 2;
  AssistantMessage message = 3;
}

// SystemTranscriptData contains system-level metadata.
message SystemTranscriptData {
  TreeNodeMeta metadata = 1;
  SystemTranscriptSubtype subtype = 2;
  int32 duration_ms = 3;
  bool is_meta = 4;
}

// SummaryTranscriptData contains conversation summary data.
message SummaryTranscriptData {
  string summary = 1;
  string leaf_uuid = 2;
}

// FileBackup represents backup info for a single file.
message FileBackup {
  string backup_file_name = 1;
  int32 version = 2;
  google.protobuf.Timestamp backup_time = 3;
}

// FileSnapshot represents file backup state at a point in time.
message FileSnapshot {
  string message_id = 1;
  map<string, FileBackup> tracked_file_backups = 2;
  google.protobuf.Timestamp timestamp = 3;
}

// FileHistorySnapshotTranscriptData contains file history snapshot data.
message FileHistorySnapshotTranscriptData {
  string message_id = 1;
  FileSnapshot snapshot = 2;
  bool is_snapshot_update = 3;
}

// ProgressData contains the progress payload.
message ProgressData {
  ProgressDataType type = 1;
  // JSON-serialized message object
  string message_json = 2;
  // JSON-serialized normalized messages array
  string normalized_messages_json = 3;
  string prompt = 4;
  string agent_id = 5;
}

// ProgressTranscriptData contains agent/skill progress transcript data.
message ProgressTranscriptData {
  TreeNodeMeta metadata = 1;
  string tool_use_id = 2;
  string parent_tool_use_id = 3;
  ProgressData data = 4;
}

// Transcript represents a single transcript entry with type-specific data.
message Transcript {
  TranscriptType type = 1;
  oneof data {
    UserTranscriptData user_data = 2;
    AssistantTranscriptData assistant_data = 3;
    SystemTranscriptData system_data = 4;
    SummaryTranscriptData summary_data = 5;
    FileHistorySnapshotTranscriptData file_history_snapshot_data = 6;
    ProgressTranscriptData progress_data = 7;
  }
}
