# GitHub Actions workflow configuration for Docusaurus documentation site deployment
#
# Workflow structure:
# 1. Trigger: Activates on push to main branch with changes in docs/ directory
# 2. Build job:
#    a. Checkout repository with full history
#    b. Setup Node.js 20 with npm caching
#    c. Install dependencies using npm ci (clean install)
#    d. Build Docusaurus site (output to docs/build/)
#    e. Upload build artifact for GitHub Pages
# 3. Deploy job:
#    a. Wait for build job to complete
#    b. Deploy uploaded artifact to GitHub Pages
#    c. Output deployed URL
#
# Permissions:
# - contents: read - for checkout
# - pages: write - for GitHub Pages deployment
# - id-token: write - for deployment verification
#
# Environment:
# - Uses github-pages environment for deployment URL tracking
#
# Concurrency:
# - Uses concurrency group to cancel in-progress deployments when new commits are pushed
# - Group name: pages
# - cancel-in-progress: true

name: Deploy Docs to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'

# Cancel in-progress deployments when new commits are pushed
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build Docusaurus
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build website
        run: npm run build

      - name: Upload Build Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/build

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest

    # Grant GITHUB_TOKEN the permissions required to make a Pages deployment
    permissions:
      pages: write
      id-token: write

    # Deploy to the github-pages environment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
